name: Build APK

on:
  repository_dispatch:
    types: [build-apk]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Notify PHP — building started
        env:
          CB_URL: ${{ github.event.client_payload.callback_url }}
          CB_SECRET: ${{ github.event.client_payload.callback_secret }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: |
          [ -z "$CB_URL" ] && exit 0
          curl -s -X POST "$CB_URL" -H "Content-Type: application/json" \
            -H "X-Callback-Secret: $CB_SECRET" \
            -d "{\"job_id\":\"$JOB_ID\",\"status\":\"building\",\"step\":\"building\"}" || true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project from scratch
        env:
          URL: ${{ github.event.client_payload.url }}
          APP_NAME: ${{ github.event.client_payload.app_name }}
          PACKAGE: ${{ github.event.client_payload.package }}
        run: |
          cordova create work "$PACKAGE" "$APP_NAME"
          cd work

          # Write config.xml (no template file needed)
          cat > config.xml <<EOF
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="$PACKAGE" version="1.0.0"
                  xmlns="http://www.w3.org/ns/widgets"
                  xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>$APP_NAME</name>
              <description>Website to APK wrapper</description>
              <author email="you@example.com" href="https://github.com/${{ github.repository_owner }}">${{ github.repository_owner }}</author>
              <content src="$URL" />
              <allow-navigation href="*" />
              <allow-intent href="*" />
              <access origin="*" />
              <preference name="AndroidInsecureFileModeEnabled" value="true" />
              <preference name="SplashMaintainAspectRatio" value="true" />
              <preference name="AndroidPersistentFileLocation" value="Internal" />
          </widget>
          EOF

          # Write www/index.html (loading page)
          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><title>Loading…</title>
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <style>body{font-family:sans-serif;text-align:center;padding-top:40vh;color:#555}</style>
          </head><body><p>Loading…</p></body></html>
          EOF

      - name: Generate signing keystore
        working-directory: work
        run: |
          keytool -genkeypair -v -keystore app.keystore -alias app \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=App, OU=Dev, O=Org, L=City, S=State, C=IN"

      - name: Write build.json
        working-directory: work
        run: |
          cat > build.json <<'EOF'
          {
            "android": {
              "release": {
                "keystore": "app.keystore",
                "storePassword": "android",
                "alias": "app",
                "password": "android",
                "keystoreType": "jks"
              }
            }
          }
          EOF

      - name: Add Android platform
        working-directory: work
        run: cordova platform add android

      - name: Notify PHP — signing
        env:
          CB_URL: ${{ github.event.client_payload.callback_url }}
          CB_SECRET: ${{ github.event.client_payload.callback_secret }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: |
          [ -z "$CB_URL" ] && exit 0
          curl -s -X POST "$CB_URL" -H "Content-Type: application/json" \
            -H "X-Callback-Secret: $CB_SECRET" \
            -d "{\"job_id\":\"$JOB_ID\",\"status\":\"signing\",\"step\":\"signing\"}" || true

      - name: Build release APK
        working-directory: work
        run: cordova build android --release

      - name: Rename APK
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: |
          APK=$(find work/platforms/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          mv "$APK" "work/app-$JOB_ID.apk"
          ls -lh "work/app-$JOB_ID.apk"

      - name: Notify PHP — uploading
        env:
          CB_URL: ${{ github.event.client_payload.callback_url }}
          CB_SECRET: ${{ github.event.client_payload.callback_secret }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: |
          [ -z "$CB_URL" ] && exit 0
          curl -s -X POST "$CB_URL" -H "Content-Type: application/json" \
            -H "X-Callback-Secret: $CB_SECRET" \
            -d "{\"job_id\":\"$JOB_ID\",\"status\":\"uploading\",\"step\":\"uploading\"}" || true

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.event.client_payload.job_id }}
          name: "APK — ${{ github.event.client_payload.app_name }}"
          body: |
            Auto-built APK
            Website: ${{ github.event.client_payload.url }}
            Package: ${{ github.event.client_payload.package }}
          files: work/app-${{ github.event.client_payload.job_id }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify PHP — done
        if: success()
        env:
          CB_URL: ${{ github.event.client_payload.callback_url }}
          CB_SECRET: ${{ github.event.client_payload.callback_secret }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          [ -z "$CB_URL" ] && exit 0
          curl -s -X POST "$CB_URL" -H "Content-Type: application/json" \
            -H "X-Callback-Secret: $CB_SECRET" \
            -d "{\"job_id\":\"$JOB_ID\",\"status\":\"done\",\"step\":\"done\",\"run_id\":\"$RUN_ID\"}" || true

      - name: Notify PHP — failed
        if: failure()
        env:
          CB_URL: ${{ github.event.client_payload.callback_url }}
          CB_SECRET: ${{ github.event.client_payload.callback_secret }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: |
          [ -z "$CB_URL" ] && exit 0
          curl -s -X POST "$CB_URL" -H "Content-Type: application/json" \
            -H "X-Callback-Secret: $CB_SECRET" \
            -d "{\"job_id\":\"$JOB_ID\",\"status\":\"failed\",\"step\":\"failed\"}" || true
